name: SQL visibility tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/sql/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tests/sql
      - run: npm test
        working-directory: tests/sql
